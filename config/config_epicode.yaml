    R2: 20260203-SK-N-SH-p53-ATRX-E6-1011-R1-RNAbulk_R2_001.fastq.gz
  ATRX_FL_2:
    condition: ATRX_FL
    R1: 20260203-SK-N-SH-p53-ATRX-E6-1011-R2-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-ATRX-E6-1011-R2-RNAbulk_R2_001.fastq.gz
  ATRX_FL_3:
    condition: ATRX_FL
    R1: 20260203-SK-N-SH-p53-ATRX-E6-1011-R3-RNAbulk_R1_001.fastq.gz
