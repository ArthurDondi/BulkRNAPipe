# ─── DESeq2 contrasts ────────────────────────────────────────────────────────
# List the pairwise comparisons DESeq2 should perform.
# Each entry: [name, numerator_condition, denominator_condition]
DESeq2:
  contrasts:
    # Each contrast: [name_for_output, numerator, denominator(reference)]
    # Compare ATRX+ cell line vs. ATRX- (E6) cell line
    - [TP53_vs_E6, E6, TP53]
    # Compare E6 alone vs. E6 + empty vector
    - [E6_vs_EmptyVector, EmptyVector, E6]
    # Compare E6 + empty vector vs. E6 + ATRX full-length
    - [EmptyVector_vs_ATRX_FL, ATRX_FL, EmptyVector]
    # Compare empty vector vs. ATRX in-frame fusion
    - [EmptyVector_vs_ATRX_IFF, ATRX_IFF, EmptyVector]
    # Compare ATRX in-frame fusion vs. ATRX full-length (FL as reference)
    - [ATRX_IFF_vs_ATRX_FL, ATRX_IFF, ATRX_FL]
    # Compare ATRX+ cell line vs. ATRX in-frame fusion
    - [TP53_vs_ATRX_IFF, ATRX_IFF, TP53]
    # Compare ATRX+ cell line vs. ATRX FL (rescue experiment)
    - [TP53_vs_ATRX_FL, ATRX_FL, TP53]


  # ─── Combined / derived conditions ─────────────────────────────────────────
  # Optional: merge two or more existing condition labels into one new label
  # for DESeq2 grouping.  Samples are NOT averaged; they remain separate
  # replicates — only their condition label is changed.
  #
  # Rules:
  #   - The combined name must not collide with any existing condition label.
  #   - Every source condition must exist in at least one sample.
  #   - A source condition may appear in multiple combined groups, as long as
  #     those groups are not both used in the same contrast.
  #   - A raw condition used on one side of a contrast must not also be a source
  #     member of the combined group on the other side.
  combine_conditions:
    ATRX_Ctrl:
      - E6
      - EmptyVector

  # ─── Interaction contrasts (difference of differences) ────────────────────
  # TP53_vs_ATRX_FL as a plain contrast mixes three things that cannot be
  # separated: ATRX status, the clonal background, and the transduction step.
  # The difference of differences removes the last two by cancellation — the
  # rescue effect is measured inside the transduced E6 background, the knockout
  # effect inside the untransduced one, and only the difference is reported.
  interactions:
    - name: ATRX_FL_rescue_shortfall
      # (ATRX_FL / EmptyVector) - (TP53 / E6)
      #   group_A = how far the rescue moved the gene, inside the transduced background
      #   group_B = how far it HAD to move to undo the KO, inside the untransduced one
      # log2FC = 0  -> complete rescue
      # log2FC < 0  -> the rescue fell short
      # log2FC > 0  -> the rescue overshot the TP53 level
      # Note group_B is [TP53, E6], not [E6, TP53]: the restoration target is the
      # KO effect reversed, so flipping it would report rescue + KO instead of the
      # residual, and a perfect rescue would score twice the effect size instead
      # of zero.
      group_A: [ATRX_FL, EmptyVector]
      group_B: [TP53, E6]
    - name: ATRX_IFF_rescue_shortfall
      # Same, for the in-frame fusion.
      group_A: [ATRX_IFF, EmptyVector]
      group_B: [TP53, E6]

  # Adjusted p-value threshold for volcano plots and result tables
  padj_threshold: 0.05
  # Absolute log2 fold-change threshold for volcano plots
  lfc_threshold: 1.0

# ─── PCA (sample-level QC) ───────────────────────────────────────────────────
# Outputs go to pca/{sample_set}/{view}_*.pdf — PC1/PC2, PC3/PC4, scree,
# coordinates, and a removeBatchEffect panel per combination.
#
# The reference is hg38_plus_vectors, so EGFP / mCherry / ATRX_FL / ATRX_IFF are
# real rows in counts.txt.  Verify the exact IDs against the custom GTF with
#   grep -o 'gene_id "[^"]*"' hg38_plus_vectors.gtf | sort -u
# pca.R prints a WARNING to logs/PCA/*.log for any entry that matches nothing.
PCA:
  # Reporter features: zero in TP53 and E6, high in the three transduced groups.
  exclude_genes:
    - EGFP
    - mCherry
  exclude_gene_patterns: []
  exclude_contigs: []
  # The transgene and its variants.  ATRX is the variable under study, so a PCA
  # that includes it partly re-plots the design; the third view drops it to show
  # what the ATRX difference does downstream rather than the difference itself.
  transgene_genes:
    - ATRX
    - ATRX_FL
    - ATRX_IFF
  ntop: 500

  # ── Sample subsets ─────────────────────────────────────────────────────────
  # PC1 of the full PCA separates TP53 from everything E6-derived — the clonal
  # background, which is confounded with the ATRX genotype and cannot be
  # removed.  Dropping TP53 lets the vector and rescue effects use PC1/PC2
  # instead of being compressed into the higher components.
  subsets:
    E6_derived:
      - E6
      - EmptyVector
      - ATRX_FL
      - ATRX_IFF
    # The three transduced groups only: removes the transduction step as well,
    # leaving the ATRX construct as the only intended difference.
    transduced_only:
      - EmptyVector
      - ATRX_FL
      - ATRX_IFF

  # ── Visualisation-only batch removal ───────────────────────────────────────
  # Transduction status.  For LOOKING ONLY — it never enters a DESeq2 design.
  # Within the full sample set the transduced batch contains three conditions
  # and the untransduced batch two, so the panel is drawn; within
  # transduced_only every sample shares one label and the script says so
  # instead of drawing a meaningless plot.
  batch:
    TP53:        untransduced
    E6:          untransduced
    EmptyVector: transduced
    ATRX_FL:     transduced
    ATRX_IFF:    transduced

# ─── Design QC ───────────────────────────────────────────────────────────────
DesignQC:
  # Defaults to PCA.exclude_genes + PCA.transgene_genes; listed explicitly here
  # so the endogenous ATRX locus is plotted next to the vector-borne variants.
  genes:
    - ATRX
    - ATRX_FL
    - ATRX_IFF
    - EGFP
    - mCherry

# ─── Optional proteomics limma overlay for separate proteomics volcano plots ──
Proteomics:
  enabled: True
  limma_xlsx: /home/arthur_d/bioinf_isilon/Research/TASCHNERMANDL/Internal/users/arthur_d/projects/epicode/251128_limmaResult_IP_MRa_051_LFQ_Experiment1_V3_filtered-KK.xlsx
  sheet: "limma result filtered"
  gene_column: "Gene"
  # Wide-format Excel: comparison_column is empty; logfc_column and fdr_column
  # are suffixes appended to the comparison name to form the actual column names
  # (e.g. "S1011_vs_control" + "_LOG2FC" → column "S1011_vs_control_LOG2FC").
  comparison_column: ""
  fdr_column: "_FDR"
  logfc_column: "_LOG2FC"
  fdr_threshold: 0.05
  # Sample code mapping used below:
  #   S1011 = ATRX_FL  |  S1744 = ATRX_IFF  |  S1760 = EmptyVector
  #   SE6   = E6  |  control = TP53
  #
  # Note: ATRX_Ctrl (DESeq2 combined NoVector+EmptyVector) has no direct
  # proteomics equivalent; the vs-control comparisons are the closest match.
  deseq2_to_proteomics_comparison:
    #TP53_vs_E6:       "SE6_vs_control"
    E6_vs_EmptyVector:  "S1760_vs_SE6"
    #EmptyVector_vs_ATRX_FL:        "S1011_vs_S1760"
    #EmptyVector_vs_ATRX_IFF:       "S1744_vs_S1760"
    ATRX_IFF_vs_ATRX_FL:                "S1744_vs_S1011"
    TP53_vs_ATRX_FL:               "S1011_vs_control" 
    TP53_vs_ATRX_IFF:              "S1744_vs_control"   

# ─── GSEA parameters ─────────────────────────────────────────────────────────
GSEA:
  collections:
    - H
    - C2:CP:REACTOME
    - C5:GO:BP
  min_size: 9
  max_size: 500
  nperm: 1000
  rank_metric: stat
  custom_gmt_files: []

# ─── GO enrichment parameters ────────────────────────────────────────────────
GO:
  ontology:
    - BP
  padj_cutoff: 0.05
  min_gs_size: 10
  max_gs_size: 500
  gene_id_type: SYMBOL

# ─── Contrast comparisons ────────────────────────────────────────────────────
# "Normalise" IFF-vs-FL by subtracting the IFF-vs-Ctrl baseline.
# ─── Signature reversal (rescue scoring) ─────────────────────────────────────
# The primary rescue readout.  Both contrasts in each pair sit inside a single
# background, so the clonal difference between TP53 and the E6 lineage never
# enters the comparison.
#
# TP53_vs_E6 has E6 as numerator, so its log2FC is "KO relative to ATRX-WT".
# EmptyVector_vs_ATRX_FL has ATRX_FL as numerator, so its log2FC is "rescue
# relative to the transduced control".  A working rescue makes the second the
# mirror image of the first: negative slope, reversal score near 1.
SignatureReversal:
  - name: ATRX_FL_reverses_KO_signature
    signature_contrast: TP53_vs_E6
    response_contrast:  EmptyVector_vs_ATRX_FL
    padj_threshold: 0.05
    lfc_threshold: 0.0
    restored_fraction: 0.5
  - name: ATRX_IFF_reverses_KO_signature
    signature_contrast: TP53_vs_E6
    response_contrast:  EmptyVector_vs_ATRX_IFF
    padj_threshold: 0.05
    lfc_threshold: 0.0
    restored_fraction: 0.5
  # Sanity check: the empty vector should NOT reverse the KO signature.  A
  # reversal score far from zero here means the score is picking up the
  # transduction step rather than ATRX, and the two rescue scores above have to
  # be read against this baseline rather than against zero.
  - name: EmptyVector_reverses_KO_signature_NEGATIVE_CONTROL
    signature_contrast: TP53_vs_E6
    response_contrast:  E6_vs_EmptyVector
    padj_threshold: 0.05
    lfc_threshold: 0.0
    restored_fraction: 0.5

ContrastComparisons:
  - name: IFF_vs_FL_normalised_by_IFF_vs_Ctrl
    contrast_A: ATRX_IFF_vs_ATRX_FL
    contrast_B: TP53_vs_ATRX_IFF
    delta_nes: True
    residual_rank: True

# ─── Tool parameters ─────────────────────────────────────────────────────────
TrimGalore:
  # Minimum read length to keep after trimming
  min_length: 20
  # Phred quality score threshold
  quality: 20
  # Extra arguments forwarded to Trim Galore (e.g. "--illumina" to force adapter)
  extra: ""

STAR:
  # Extra arguments forwarded to STAR genome generate
  index_extra: ""
  # Extra arguments forwarded to STAR aligner
  align_extra: ""

featureCounts:
  # Minimum mapping quality for a read to be counted
  min_mq: 10
  # Extra arguments forwarded to featureCounts
  extra: ""
