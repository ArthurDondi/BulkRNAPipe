    R1: 20260203-SK-N-SH-p53-R2-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-R2-RNAbulk_R2_001.fastq.gz
  TP53_3:
    condition: TP53
    R1: 20260203-SK-N-SH-p53-R3-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-R3-RNAbulk_R2_001.fastq.gz

  E6_1:
    condition: E6
    R1: 20260203-SK-N-SH-p53-ATRX-E6-R1-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-ATRX-E6-R1-RNAbulk_R2_001.fastq.gz
  E6_2:
    condition: E6
    R1: 20260203-SK-N-SH-p53-ATRX-E6-R2-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-ATRX-E6-R2-RNAbulk_R2_001.fastq.gz
  E6_3:
    condition: E6
    R1: 20260203-SK-N-SH-p53-ATRX-E6-R3-RNAbulk_R1_001.fastq.gz
    R2: 20260203-SK-N-SH-p53-ATRX-E6-R3-RNAbulk_R2_001.fastq.gz

